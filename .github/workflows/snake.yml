# Draws the contribution "snake" from this account's own activity, once a day, onto the output branch
# that the profile README shows.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#B08A3E&color_dots=#ebedf0,#e8dcc0,#d8be86,#c29a4e,#8a6526
            dist/snake-dark.svg?palette=github-dark&color_snake=#D4AF65&color_dots=#161b22,#2a3442,#4b5d73,#9a8150,#d4af65

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
